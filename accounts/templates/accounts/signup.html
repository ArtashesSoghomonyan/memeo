{% extends 'base.html' %}

{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-lg shadow p-6 mt-10">
  <h1 class="text-2xl font-bold mb-4">Create an Account</h1>
  <form method="post">
    {% csrf_token %}
    <div id="username-error"></div>
    {{ form.username }}
    <div id="email-error"></div>
    {{ form.email }}
    {{ form.first_name }}
    {{ form.last_name }}
    <div id="password1-error"></div>
    {{ form.password1 }}
    <div id="password2-error"></div>
    {{ form.password2 }}
    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 w-full">Sign Up</button>
  </form>
  <p class="mt-2 text-sm">Already have an account? <a href="{% url 'login' %}" class="text-indigo-600 hover:underline">Log in</a></p>
</div>
{% endblock %}
