{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-lg shadow p-6 mt-3">
  <h1 class="text-2xl font-bold mb-4">Edit Post</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex items-center space-x-4 mt-4">
      <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
        Save Changes
      </button>
      <a href="{% url 'post_detail' post.id %}" class="text-gray-500 hover:underline">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
