{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-lg shadow p-6 text-center">
  <h1 class="text-xl font-bold mb-4">Are you sure you want to delete this post?</h1>
  <div class="mb-4">
    <img src="{{ post.image.url }}" alt="Post image" class="w-full rounded">
    <p class="mt-2 text-gray-800">{{ post.content }}</p>
  </div>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex items-center space-x-4 mt-4">
      <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
        Yes, delete it
      </button>
      <a href="{% url 'post_detail' post.id %}" class="text-gray-500 hover:underline">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
